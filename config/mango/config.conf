# MangoWC configuration (PULSAR)
# Docs: https://github.com/DreamMaoMao/mangowc/tree/main/docs
# Validate: mango -c config/mango/config.conf -p

# Session: graphical-session.target -> Noctalia (bar, wallpaper, notifications).
# MANGO_INSTANCE_SIGNATURE (IPC socket) is needed by Noctalia's Mango workspace backend.
exec_once=systemctl --user import-environment MANGO_INSTANCE_SIGNATURE && systemctl --user start mango-session.target

# Display: Framework 13 panel (2880x1920 @ 120Hz)
monitor_rule=name:^eDP-1$,width:2880,height:1920,refresh:120,x:0,y:0,scale:1.6

# Input
xkb_rules_layout=us
repeat_rate=25
repeat_delay=600
tap_to_click=1
tap_and_drag=1
trackpad_natural_scrolling=1
trackpad_disable_while_typing=1
sloppy_focus=1
warp_cursor=1
cursor_size=24

# Appearance (borderless, rounded, consistent 8px gaps)
border_px=0
border_radius=10
no_radius_when_single=0
gap_inner_horizontal=8
gap_inner_vertical=8
gap_outer_horizontal=8
gap_outer_vertical=8
smart_gaps=0
root_color=0x0b0f19ff
focus_color=0x334155ff
border_color=0x0b0f19ff
urgent_color=0xef4444ff

# Blur & shadows for windows; not for layer surfaces, so Noctalia renders its own
blur=1
blur_layer=0
blur_optimized=1
blur_params_num_passes=3
blur_params_radius=5
blur_params_noise=0.02
blur_params_brightness=0.9
blur_params_contrast=0.9
blur_params_saturation=1.0
shadows=1
layer_shadows=0
shadow_only_floating=0
shadows_size=15
shadows_blur=15
shadows_color=0x00000099

# Animations (layer animations off: Noctalia animates its own panels)
animations=1
layer_animations=0
animation_type_open=zoom
animation_type_close=zoom

# Layouts: tile on every tag, master area 55%
default_master_factor=0.55
default_master_count=1
new_is_master=0
tag_rule=id:1,layout_name:tile
tag_rule=id:2,layout_name:tile
tag_rule=id:3,layout_name:tile
tag_rule=id:4,layout_name:tile
tag_rule=id:5,layout_name:tile
tag_rule=id:6,layout_name:tile
tag_rule=id:7,layout_name:tile
tag_rule=id:8,layout_name:tile
tag_rule=id:9,layout_name:tile

# Apps
bind=SUPER,Return,spawn,foot
bind=SUPER,space,spawn,noctalia msg panel-toggle launcher
bind=SUPER,e,spawn,nemo
bind=SUPER,v,spawn,noctalia msg panel-toggle clipboard

# Session
bind=SUPER,q,killclient
bind=SUPER+SHIFT,q,quit
bind=SUPER+SHIFT,c,reload_config

# Window state & layouts
bind=SUPER,f,togglefullscreen
bind=SUPER+SHIFT,space,togglefloating
bind=SUPER,m,togglemaximizescreen
bind=SUPER,t,setlayout,tile
bind=SUPER,s,setlayout,scroller
bind=SUPER,w,setlayout,monocle
bind=SUPER,n,switch_layout
bind=SUPER,o,toggleoverview

# Window switcher (Noctalia)
bind=SUPER,Tab,spawn,noctalia msg window-switcher
bind=ALT,Tab,spawn,noctalia msg window-switcher
bind=SUPER+SHIFT,Tab,spawn,noctalia msg window-switcher
bind=ALT+SHIFT,Tab,spawn,noctalia msg window-switcher

# Focus
bind=SUPER,Left,focusdir,left
bind=SUPER,Down,focusdir,down
bind=SUPER,Up,focusdir,up
bind=SUPER,Right,focusdir,right
bind=SUPER,h,focusdir,left
bind=SUPER,j,focusdir,down
bind=SUPER,k,focusdir,up
bind=SUPER,l,spawn,noctalia msg session lock

# Move windows
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,j,exchange_client,down
bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,l,exchange_client,right

# Master area size
bind=SUPER+CTRL,Left,setmfact,-0.05
bind=SUPER+CTRL,Right,setmfact,+0.05

# Tags (workspaces): view, and move window + follow
bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9
bind=SUPER+SHIFT,1,tag,1
bind=SUPER+SHIFT,2,tag,2
bind=SUPER+SHIFT,3,tag,3
bind=SUPER+SHIFT,4,tag,4
bind=SUPER+SHIFT,5,tag,5
bind=SUPER+SHIFT,6,tag,6
bind=SUPER+SHIFT,7,tag,7
bind=SUPER+SHIFT,8,tag,8
bind=SUPER+SHIFT,9,tag,9

# Volume & brightness
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl set +5%
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl set 5%-

# Screenshots
bind=SUPER+SHIFT,s,spawn,screenshot area
bind=SUPER+SHIFT,p,spawn,screenshot fullscreen
bind=SUPER+CTRL,s,spawn,screenshot area
bind=NONE,Print,spawn,screenshot fullscreen
bind=SHIFT,Print,spawn,screenshot area
bind=CTRL,Print,spawn,screenshot area

# Mouse: Super + drag moves, Super + right-drag resizes
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# Touchpad: Super + scroll switches tags
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client
